<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quiz System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333;
        }

        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .admin-link {
            position: absolute;
            top: 20px;
            right: 20px;
            text-decoration: none;
            color: #555;
            font-weight: bold;
            font-size: 16px;
        }

        .admin-link:hover {
            color: #000;
            text-decoration: underline;
        }

        .author-label {
            text-align: center;
            color: #555;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <a href="/admin" class="admin-link">Admin Panel</a>

    <h1>Quiz System</h1>
    <p>Welcome to the Quiz! Test your knowledge.</p>
    <br><br>
    <a href="/quiz" class="btn">Start Quiz</a>
    <br><br>
    <p th:if="${param.message}" style="color: green;">
        <span th:text="${param.message}"></span>
    </p>
    <br><br>
    <label class="author-label">Created by Ayet Enes Alkus</label>
</body>

</html>
