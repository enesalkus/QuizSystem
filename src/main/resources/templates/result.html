<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quiz Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .score-box {
            border: 2px solid #007bff;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #007bff;
        }

        .btn {
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            display: inline-block;
        }

        .btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
    <h1>Quiz Finished!</h1>
    <div class="score-box">
        <h2>Your Score: <span th:text="${score}">0</span> / <span th:text="${total}">10</span></h2>
    </div>
    <br>
    <a href="/" class="btn">Back to Home</a>
</body>

</html>
