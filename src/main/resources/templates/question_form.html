<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Question Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .answer-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .answer-row input[type="text"] {
            flex-grow: 1;
            margin-right: 10px;
        }

        .btn {
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-save {
            background-color: #28a745;
        }

        .btn-cancel {
            background-color: #6c757d;
        }
    </style>
</head>

<body>
    <h1 th:text="${question.id == null} ? 'Create New Question' : 'Edit Question'">Edit Question</h1>

    <form action="#" th:action="@{/admin/save}" th:object="${question}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Question Text:</label>
            <input type="text" th:field="*{text}" required />
        </div>

        <div class="form-group">
            <label>Answers (Check 'Correct' box):</label>
            <div th:each="answer, stat : *{answers}" class="answer-row">
                <input type="hidden" th:field="*{answers[__${stat.index}__].id}" />
                <input type="text" th:field="*{answers[__${stat.index}__].text}" placeholder="Answer text" />
                <label style="margin-bottom: 0;">
                    <input type="checkbox" th:field="*{answers[__${stat.index}__].correct}" /> Correct
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-save">Save Question</button>
        <a href="/admin" class="btn btn-cancel">Cancel</a>
    </form>
</body>

</html>
